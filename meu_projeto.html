<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Jóias Pandora</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <script type="text/javascript" src="vue.js"></script>
</head>
<body>
    <div id="app" class="container mt-4">
        <div class="row">
            <div class="col-md-6">
                <h1>Cadastro de Jóias Pandora</h1>

                <form action="#" method="post">

                    <label for="codigo">Código da Jóia</label>
                    <input type="number" class="form-control mb-2">

                    <label for="nome">Nome da Jóia</label>
                    <input type="text" class="form-control mb-2">

                    <label for="categoria">Categoria</label>
                    <input type="text" class="form-control mb-2" placeholder="Anel, Colar, Pulseira...">

                    <label for="material">Material</label>
                    <input type="text" class="form-control mb-2" placeholder="Prata, Ouro, Rosé...">

                    <label for="preco">Preço (R$)</label>
                    <input type="number" step="0.01" class="form-control mb-3">

                    <button class="btn btn-primary">Salvar</button>

                </form>
            </div>

            <div class="col-md-6">
                <h1>Lista de Jóias</h1>

                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Material</th>
                            <th>Preço</th>
                        </tr>
                    </thead>

                    <tbody>

                    </tbody>

                </table>
            </div>
        </div>
    </div>

    <script type="text/javascript">

        class Joia {

            constructor(codigo, nome, categoria, material, preco){

                this.codigo = codigo
                this.nome = nome
                this.categoria = categoria
                this.material = material
                this.preco = preco

            }

        }

    </script>
</body>
</html>
